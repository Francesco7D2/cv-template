name: Build CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Released files are named <PDF_NAME>-<variant>.pdf, e.g. Jane_Doe_CV-industry.pdf
  PDF_NAME: CV

jobs:
  build:
    runs-on: ubuntu-latest
    # Current TeX Live, the same release that MacTeX and the TeX Live installer
    # ship. Ubuntu's packaged TeX Live is a few years older and lays pages out
    # slightly differently, so a CV that fits locally could spill over here.
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and check
        run: |
          command -v make >/dev/null || { apt-get update && apt-get install -y make; }
          make check

      # The PDFs are uploaded even when the check fails, so you can see why.
      - name: Name the PDFs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p release
          for f in dist/*.pdf; do
            [ -e "$f" ] || continue
            cp "$f" "release/${PDF_NAME}-$(basename "$f")"
          done

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cv
          path: release/*.pdf
          if-no-files-found: ignore

      - name: Publish the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest CV
          body: Built from the main branch.
          artifacts: release/*.pdf
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
